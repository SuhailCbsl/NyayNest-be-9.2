#######################################################################
# audit.cfg  — DSpace module config for AuditTrailConsumer
# Registers the plugin and subscribes it to all events.
#######################################################################

# Register the AuditTrailConsumer with the Plugin Manager under the short name "audit"
plugin.named.org.dspace.event.Consumer = \
    org.dspace.app.rest.audit.AuditTrailConsumer = audit

# Event consumer class for the "audit" consumer
event.consumer.audit.class = org.dspace.app.rest.audit.AuditTrailConsumer

# Subscribe to all events (subject+action). WARNING: produces large volume.
# "All+All" means every subject (Item, Collection, Community, Bitstream, EPerson, etc)
# and every action (Create, Modify, Delete, Install, Remove, etc).
# event.consumer.audit.filters = Item|Collection|Community|Bitstream|EPerson
# subscribe only to higher-level actions for Items / Collections / Communities

# event.consumer.audit.filters = \
#   Item+Create:Item+Install:Item+Modify_Metadata:Item+Delete, \
#   Collection+Create:Collection+Modify_Metadata:Collection+Delete, \
#   Community+Create:Community+Modify_Metadata:Community+Delete, \
#   Bitstream+Create:Bitstream+Modify_Metadata:Bitstream+Delete, \
#   EPerson+Create:EPerson+Modify_Metadata:EPerson+Delete

# event.consumer.audit.filters = \
#   Item+INSTALL, \
#   Item+DELETE, \
#   Collection+CREATE,Collection+DELETE, \
#   Community+CREATE,Community+DELETE, \
#   Bitstream+RETRIEVE, \
#   EPerson+LOGIN

   event.consumer.audit.filters = All+All

# Optional: if you want to explicitly enable/disable this consumer at runtime
# (some installs honor this). Default is enabled if present.
event.consumer.audit.enabled = true

# Optional: priority for ordering consumers if you have ordering needs.
# Lower numeric -> earlier execution. (Uncomment & tune if required)
# event.consumer.audit.order = 50
